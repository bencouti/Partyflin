<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f0d0b">
<title>Partyflin · Vote</title>
<style>
  :root {
    --bg: #0f0d0b;
    --surface: #1a1714;
    --surface-2: #241f1b;
    --line: rgba(255, 240, 220, .09);
    --text: #f5efe6;
    --muted: #a99e90;
    --accent: #ffb547;
    --accent-ink: #1d1404;
    --danger: #ff6b5b;
    --ok: #5fd39a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  button, input { font: inherit; color: inherit; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }

  header { padding: 28px 0 8px; }
  .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  h1 { font-size: clamp(26px, 6vw, 40px); line-height: 1.1; margin: 6px 0 8px; letter-spacing: -.02em; }
  .desc { color: var(--muted); margin: 0 0 6px; max-width: 60ch; white-space: pre-line; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 4px rgba(95, 211, 154, .15); }
  .dot.closed { background: var(--danger); box-shadow: 0 0 0 4px rgba(255, 107, 91, .15); }

  .identity { margin: 18px 0 4px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .identity label { font-weight: 600; }
  .field {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; min-width: 0; flex: 1 1 200px; max-width: 320px; outline: none;
  }
  .field:focus { border-color: var(--accent); }

  .tabs { display: flex; gap: 4px; margin: 18px 0 14px; border-bottom: 1px solid var(--line); }
  .tab {
    background: none; border: 0; padding: 10px 14px; cursor: pointer; color: var(--muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 600;
  }
  .tab[aria-selected="true"] { color: var(--text); border-color: var(--accent); }
  .tab:disabled { opacity: .4; cursor: default; }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar .field { max-width: none; }
  .hint { color: var(--muted); font-size: 13px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; padding-bottom: 120px; }
  @media (max-width: 420px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } }

  .card { position: relative; border-radius: var(--radius); background: var(--surface); overflow: hidden; cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease; outline: none; }
  .card:hover { transform: translateY(-2px); }
  .card:focus-visible { box-shadow: 0 0 0 2px var(--accent); }
  .poster { aspect-ratio: 2 / 3; width: 100%; display: block; object-fit: cover; background: var(--surface-2); }
  .poster.placeholder { display: flex; align-items: center; justify-content: center; padding: 12px; text-align: center;
    color: var(--muted); font-weight: 600; background: linear-gradient(160deg, #2d2620, #17130f); }
  .meta { padding: 8px 10px 10px; }
  .name { font-weight: 600; font-size: 14px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .card.selected { box-shadow: 0 0 0 3px var(--accent); }
  .card.selected .poster { filter: brightness(.75); }
  .check { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.7);
    transition: all .15s ease; }
  .card.selected .check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .check svg { width: 16px; height: 16px; opacity: 0; }
  .card.selected .check svg { opacity: 1; }
  .info { position: absolute; top: 8px; left: 8px; width: 30px; height: 30px; border-radius: 50%; border: 0;
    background: rgba(0,0,0,.55); color: #fff; font-weight: 700; font-family: Georgia, serif; font-style: italic; cursor: pointer; }
  .readonly .card { cursor: default; }
  .readonly .card:hover { transform: none; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(15, 13, 11, .92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); padding: 12px 0 calc(12px + env(safe-area-inset-bottom));
  }
  .bar .wrap { display: flex; align-items: center; gap: 12px; justify-content: space-between; }
  .bar-text { font-size: 14px; color: var(--muted); }
  .bar-text strong { color: var(--text); font-size: 16px; }
  .btn {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px;
    padding: 12px 22px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.ghost { background: var(--surface-2); color: var(--text); }

  .results { padding-bottom: 60px; }
  .result { display: grid; grid-template-columns: 28px 52px 1fr; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .rank { font-weight: 800; font-size: 20px; color: var(--muted); text-align: center; }
  .result:first-child .rank { color: var(--accent); }
  .thumb { width: 52px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 6px; background: var(--surface-2); }
  .result-head { display: flex; justify-content: space-between; gap: 8px; }
  .votes { font-weight: 700; white-space: nowrap; }
  .track { height: 6px; border-radius: 3px; background: var(--surface-2); margin: 6px 0 4px; overflow: hidden; }
  .track div { height: 100%; background: var(--accent); border-radius: 3px; }
  .voters { color: var(--muted); font-size: 13px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }

  .banner { border-radius: 10px; padding: 10px 14px; margin: 14px 0 0; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }

  dialog {
    border: 0; padding: 0; border-radius: 18px; background: var(--surface); color: var(--text);
    width: min(560px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  }
  dialog::backdrop { background: rgba(0,0,0,.7); }
  .sheet { display: grid; grid-template-columns: 130px 1fr; gap: 16px; padding: 18px; }
  @media (max-width: 460px) { .sheet { grid-template-columns: 1fr; } .sheet img { max-width: 160px; } }
  .sheet img { width: 100%; border-radius: 10px; aspect-ratio: 2 / 3; object-fit: cover; background: var(--surface-2); }
  .sheet h2 { margin: 0 0 4px; font-size: 22px; line-height: 1.2; }
  .sheet p { color: var(--muted); margin: 10px 0 0; max-height: 40vh; overflow-y: auto; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .pill { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .sheet-actions { display: flex; gap: 10px; justify-content: flex-end; padding: 0 18px 18px; }

  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600;
    transition: all .25s ease; pointer-events: none; z-index: 20; max-width: calc(100vw - 32px); text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .toast.error { background: var(--danger); color: #fff; }

  .loading { padding: 80px 0; text-align: center; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Chargement…</div>
</div>

<div class="bar" id="bar" hidden>
  <div class="wrap">
    <div class="bar-text" id="barText"></div>
    <button class="btn" id="submit" type="button">Envoyer mon vote</button>
  </div>
</div>

<dialog id="details"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  var match = location.pathname.match(/^(.*)\/Partyflin\/Vote\/([^\/]+)/i);
  var base = match ? match[1] : '';
  var token = match ? match[2] : '';
  var apiRoot = base + '/Partyflin/Vote/' + encodeURIComponent(token);

  var state = {
    data: null,
    selected: new Set(),
    saved: new Set(),
    name: '',
    tab: 'vote',
    filter: ''
  };

  var checkIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  function storageGet(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function storageSet(key, value) { try { localStorage.setItem(key, value); } catch (e) { } }

  function randomId() {
    if (window.crypto && crypto.getRandomValues) {
      var bytes = new Uint8Array(16);
      crypto.getRandomValues(bytes);
      return Array.prototype.map.call(bytes, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    }
    return (Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2)).slice(0, 32);
  }

  // Un identifiant par navigateur : permet de modifier son vote plus tard.
  var voterId = storageGet('partyflin.voter') || randomId();
  storageSet('partyflin.voter', voterId);

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(id) { return String(id).replace(/-/g, '').toLowerCase(); }
  function posterUrl(id) { return apiRoot + '/Poster/' + norm(id); }
  function $(id) { return document.getElementById(id); }

  function toast(message, isError) {
    var t = $('toast');
    t.textContent = message;
    t.className = 'toast show' + (isError ? ' error' : '');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { t.className = 'toast'; }, 3200);
  }

  function readError(res) {
    return res.text().then(function (t) {
      try { var p = JSON.parse(t); return typeof p === 'string' ? p : (p.title || t); } catch (e) { return t; }
    });
  }

  function load() {
    return fetch(apiRoot + '/Data?voterId=' + encodeURIComponent(voterId), { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error(res.status === 404 ? 'Ce lien de vote n\'existe pas ou a été supprimé.' : 'Erreur ' + res.status);
        return res.json();
      })
      .then(function (data) {
        state.data = data;
        state.saved = new Set(data.MyVotes.map(norm));
        state.selected = new Set(state.saved);
        state.name = data.MyName || storageGet('partyflin.name') || '';
        if (!data.IsOpen && data.Results) state.tab = 'results';
        document.title = data.Title + ' · Partyflin';
        render();
      })
      .catch(function (err) {
        $('app').innerHTML = '<div class="loading">' + esc(err.message) + '</div>';
      });
  }

  function formatDeadline(iso) {
    var d = new Date(iso);
    return d.toLocaleString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  }

  function movieSub(m) {
    var parts = [];
    if (m.Year) parts.push(m.Year);
    if (m.RuntimeMinutes) parts.push(Math.floor(m.RuntimeMinutes / 60) + 'h' + ('0' + (m.RuntimeMinutes % 60)).slice(-2));
    return parts.join(' · ');
  }

  function render() {
    var d = state.data;
    var max = d.MaxVotesPerVoter;
    var resultsLocked = !d.Results;
    var lockLabel = d.ResultsVisibility === 'AfterClose' ? 'à la clôture' : 'après votre vote';

    var status = d.IsOpen
      ? '<span class="dot"></span>Vote ouvert' + (d.ClosesAt ? ' jusqu\'au ' + esc(formatDeadline(d.ClosesAt)) : '')
      : '<span class="dot closed"></span>Vote clôturé';

    var rule = max > 0
      ? 'Choisissez jusqu\'à <strong>' + max + '</strong> film' + (max > 1 ? 's' : '') + '.'
      : 'Choisissez tous les films qui vous tentent.';

    $('app').innerHTML =
      '<header>' +
        '<div class="eyebrow">Soirée film</div>' +
        '<h1>' + esc(d.Title) + '</h1>' +
        (d.Description ? '<p class="desc">' + esc(d.Description) + '</p>' : '') +
        '<div class="status">' + status + '</div>' +
        (d.IsOpen
          ? '<div class="identity"><label for="name">Votre prénom</label>' +
            '<input class="field" id="name" maxlength="40" autocomplete="given-name" placeholder="ex. Camille" value="' + esc(state.name) + '"></div>'
          : '') +
      '</header>' +
      '<div class="tabs" role="tablist">' +
        '<button class="tab" role="tab" data-tab="vote" aria-selected="' + (state.tab === 'vote') + '">Films (' + d.Movies.length + ')</button>' +
        '<button class="tab" role="tab" data-tab="results" aria-selected="' + (state.tab === 'results') + '"' + (resultsLocked ? ' disabled title="Résultats visibles ' + lockLabel + '"' : '') + '>' +
          'Résultats' + (resultsLocked ? ' 🔒' : ' (' + d.Results.VoterCount + ')') + '</button>' +
      '</div>' +
      '<section id="voteView"' + (state.tab === 'vote' ? '' : ' hidden') + '>' +
        '<div class="toolbar">' +
          (d.Movies.length > 8 ? '<input class="field" id="filter" type="search" placeholder="Filtrer par titre ou genre…" value="' + esc(state.filter) + '">' : '') +
          '<span class="hint">' + (d.IsOpen ? rule + ' Touchez une affiche pour la sélectionner.' : 'Le vote est terminé.') + '</span>' +
        '</div>' +
        '<div class="grid' + (d.IsOpen ? '' : ' readonly') + '" id="grid"></div>' +
      '</section>' +
      '<section id="resultsView" class="results"' + (state.tab === 'results' ? '' : ' hidden') + '></section>';

    renderGrid();
    renderResults();
    renderBar();
    bind();
  }

  function renderGrid() {
    var d = state.data;
    var f = state.filter.trim().toLowerCase();
    var movies = d.Movies.filter(function (m) {
      return !f || m.Name.toLowerCase().indexOf(f) >= 0 || m.Genres.some(function (g) { return g.toLowerCase().indexOf(f) >= 0; });
    });
    $('grid').innerHTML = movies.length ? movies.map(function (m) {
      var id = norm(m.Id);
      var poster = m.HasPoster
        ? '<img class="poster" loading="lazy" alt="" src="' + posterUrl(id) + '">'
        : '<div class="poster placeholder">' + esc(m.Name) + '</div>';
      return '<div class="card' + (state.selected.has(id) ? ' selected' : '') + '" data-id="' + id + '" tabindex="0" role="checkbox" aria-checked="' + state.selected.has(id) + '" aria-label="' + esc(m.Name) + '">' +
        poster +
        (d.IsOpen ? '<span class="check">' + checkIcon + '</span>' : '') +
        '<button class="info" type="button" data-info="' + id + '" aria-label="Détails">i</button>' +
        '<div class="meta"><div class="name">' + esc(m.Name) + '</div><div class="sub">' + esc(movieSub(m)) + '</div></div>' +
      '</div>';
    }).join('') : '<div class="empty">Aucun film ne correspond.</div>';
  }

  function renderResults() {
    var r = state.data.Results;
    var view = $('resultsView');
    if (!r) { view.innerHTML = ''; return; }
    if (!r.Entries.length) { view.innerHTML = '<div class="empty">Personne n\'a encore voté.</div>'; return; }
    var top = r.Entries[0].Votes;
    view.innerHTML = '<p class="hint">' + r.VoterCount + ' votant' + (r.VoterCount > 1 ? 's' : '') + '</p>' +
      r.Entries.map(function (e, i) {
        return '<div class="result">' +
          '<div class="rank">' + (i + 1) + '</div>' +
          '<img class="thumb" loading="lazy" alt="" src="' + posterUrl(e.ItemId) + '">' +
          '<div><div class="result-head"><strong>' + esc(e.Name) + (e.Year ? ' <span class="hint">(' + e.Year + ')</span>' : '') + '</strong>' +
          '<span class="votes">' + e.Votes + ' vote' + (e.Votes > 1 ? 's' : '') + '</span></div>' +
          '<div class="track"><div style="width:' + Math.round(e.Votes * 100 / top) + '%"></div></div>' +
          '<div class="voters">' + esc(e.Voters.join(', ')) + '</div></div>' +
        '</div>';
      }).join('');
  }

  function sameSets(a, b) {
    if (a.size !== b.size) return false;
    var same = true;
    a.forEach(function (x) { if (!b.has(x)) same = false; });
    return same;
  }

  function renderBar() {
    var d = state.data;
    var bar = $('bar');
    if (!d.IsOpen || state.tab !== 'vote') { bar.hidden = true; return; }
    bar.hidden = false;
    var n = state.selected.size;
    var max = d.MaxVotesPerVoter;
    var changed = !sameSets(state.selected, state.saved) || (state.name.trim() !== (d.MyName || '') && state.saved.size > 0);
    $('barText').innerHTML = '<strong>' + n + (max > 0 ? ' / ' + max : '') + '</strong> sélectionné' + (n > 1 ? 's' : '') +
      (state.saved.size && !changed ? ' · <span style="color:var(--ok)">vote enregistré ✓</span>' : '');
    var submit = $('submit');
    submit.textContent = state.saved.size ? 'Mettre à jour' : 'Envoyer mon vote';
    submit.disabled = !changed || (n === 0 && state.saved.size === 0);
  }

  function toggle(id) {
    var d = state.data;
    if (!d.IsOpen) return;
    if (state.selected.has(id)) {
      state.selected.delete(id);
    } else {
      if (d.MaxVotesPerVoter > 0 && state.selected.size >= d.MaxVotesPerVoter) {
        toast('Maximum ' + d.MaxVotesPerVoter + ' film' + (d.MaxVotesPerVoter > 1 ? 's' : '') + ' : retirez-en un d\'abord.', true);
        return;
      }
      state.selected.add(id);
    }
    var card = document.querySelector('.card[data-id="' + id + '"]');
    if (card) {
      card.classList.toggle('selected', state.selected.has(id));
      card.setAttribute('aria-checked', state.selected.has(id));
    }
    renderBar();
  }

  function openDetails(id) {
    var m = state.data.Movies.find(function (x) { return norm(x.Id) === id; });
    if (!m) return;
    var dlg = $('details');
    var pills = m.Genres.map(function (g) { return '<span class="pill">' + esc(g) + '</span>'; }).join('');
    if (m.OfficialRating) pills += '<span class="pill">' + esc(m.OfficialRating) + '</span>';
    if (m.CommunityRating) pills += '<span class="pill">★ ' + m.CommunityRating.toFixed(1) + '</span>';
    var selected = state.selected.has(id);
    dlg.innerHTML =
      '<div class="sheet">' +
        (m.HasPoster ? '<img alt="" src="' + posterUrl(id) + '">' : '<div class="poster placeholder" style="border-radius:10px">' + esc(m.Name) + '</div>') +
        '<div><h2>' + esc(m.Name) + '</h2><div class="hint">' + esc(movieSub(m)) + '</div>' +
        '<div class="pills">' + pills + '</div>' +
        (m.Overview ? '<p>' + esc(m.Overview) + '</p>' : '') + '</div>' +
      '</div>' +
      '<div class="sheet-actions">' +
        '<button class="btn ghost" type="button" data-close>Fermer</button>' +
        (state.data.IsOpen ? '<button class="btn" type="button" data-pick>' + (selected ? 'Retirer de ma sélection' : 'Je veux voir ce film') + '</button>' : '') +
      '</div>';
    dlg.querySelector('[data-close]').onclick = function () { dlg.close(); };
    var pick = dlg.querySelector('[data-pick]');
    if (pick) pick.onclick = function () { toggle(id); dlg.close(); };
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  }

  function submit() {
    var name = state.name.trim();
    if (!name) {
      toast('Indiquez votre prénom avant de voter.', true);
      var input = $('name');
      if (input) { input.focus(); input.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
      return;
    }
    var btn = $('submit');
    btn.disabled = true;
    fetch(apiRoot + '/Ballot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ VoterId: voterId, VoterName: name, ItemIds: Array.from(state.selected) })
    }).then(function (res) {
      if (!res.ok) return readError(res).then(function (msg) { throw new Error(msg); });
      storageSet('partyflin.name', name);
      toast(state.selected.size ? 'Vote enregistré, merci ' + name + ' !' : 'Vote retiré.');
      return load();
    }).catch(function (err) {
      toast(err.message || 'Impossible d\'enregistrer le vote.', true);
      renderBar();
    });
  }

  function bind() {
    document.querySelectorAll('.tab').forEach(function (tab) {
      tab.onclick = function () {
        if (tab.disabled) return;
        state.tab = tab.getAttribute('data-tab');
        document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-selected', t === tab); });
        $('voteView').hidden = state.tab !== 'vote';
        $('resultsView').hidden = state.tab !== 'results';
        renderBar();
      };
    });

    var name = $('name');
    if (name) name.oninput = function () { state.name = name.value; renderBar(); };

    var filter = $('filter');
    if (filter) filter.oninput = function () { state.filter = filter.value; renderGrid(); };

    var grid = $('grid');
    grid.onclick = function (e) {
      var info = e.target.closest('[data-info]');
      if (info) { openDetails(info.getAttribute('data-info')); return; }
      var card = e.target.closest('.card');
      if (card) toggle(card.getAttribute('data-id'));
    };
    grid.onkeydown = function (e) {
      var card = e.target.closest('.card');
      if (card && e.target === card && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); toggle(card.getAttribute('data-id')); }
    };
    grid.addEventListener('error', function (e) {
      if (e.target.tagName === 'IMG') {
        var ph = document.createElement('div');
        ph.className = 'poster placeholder';
        ph.textContent = e.target.closest('.card').getAttribute('aria-label');
        e.target.replaceWith(ph);
      }
    }, true);
  }

  $('app').addEventListener('error', function (e) {
    if (e.target.classList && e.target.classList.contains('thumb')) e.target.style.visibility = 'hidden';
  }, true);
  $('submit').onclick = submit;
  $('details').addEventListener('click', function (e) { if (e.target === this) this.close(); });

  load();
})();
</script>
</body>
</html>
