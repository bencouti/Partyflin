owner: "partyflin"
overview: "Liens de vote pour choisir le film d'une soirée entre amis"
description: >
  Créez des soirées films et partagez un lien de vote public. Les films proposés
  peuvent venir d'un genre, d'une bibliothèque, d'une playlist, de collections ou
  être choisis individuellement.
category: "General"
artifacts:
  - "Jellyfin.Plugin.Partyflin.dll"
changelog: >
  Sécurité : Content-Security-Policy stricte sur la page de vote, pas de Referer, interdiction des iframes,
  requêtes de vote limitées à 16 Ko, 200 participants maximum par soirée, prénoms nettoyés,
  jeton comparé en temps constant, liste de films mise en cache 30 s.
